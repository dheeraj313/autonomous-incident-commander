server:
  port: 8082

spring:
  application:
    name: orders-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aic?currentSchema=orders}
    username: ${SPRING_DATASOURCE_USERNAME:aic}
    password: ${SPRING_DATASOURCE_PASSWORD:aic}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: orders
        format_sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

aic:
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-key-change-me}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  payments-service:
    url: ${PAYMENTS_SERVICE_URL:http://localhost:8084}
  orders:
    unit-price: 9.99
  circuit-breaker:
    failure-threshold: 3
    failure-window-seconds: 30
    open-seconds: 30
  fault-injection:
    redis-key-prefix: "fault-injection:orders-service"
